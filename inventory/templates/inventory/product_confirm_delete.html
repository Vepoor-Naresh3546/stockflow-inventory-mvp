<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Delete product</title>
  </head>
  <body>
    <h1>Delete product</h1>
    <p>Are you sure you want to delete “{{ product.name }}” ({{ product.sku }})?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Confirm delete</button>
    </form>
    <p><a href="{% url 'product_list' %}">Cancel</a></p>
  </body>
</html>
